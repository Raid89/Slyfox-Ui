<div class="css-vars-table-wrapper">
  <table class="css-vars-table">
    <thead>
      <tr>
        <th>Variable</th>
        <th>Valor por defecto</th>
        <th>Descripción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of variables">
        <td><code>{{v.name}}</code></td>
        <td><code>{{v.default}}</code></td>
        <td>{{v.description}}</td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="example" class="code-example" style="margin-top:1.5rem;">
    <strong>{{exampleTitle || 'Ejemplo de personalización por instancia:'}}</strong>
    <pre><code class="language-html">{{example}}</code></pre>
  </div>
</div>
